# Generado por maospy-theme (@NAME@)
general {
    hide_cursor = true
}

background {
    monitor =
    path = @WALLPATH@
    blur_passes = 2
    blur_size = 6
}

label {
    monitor =
    text = $TIME
    color = rgba(@FG_RGB@, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d de %B"
    color = rgba(@FG2_RGB@, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 10
    outer_color = rgba(@ACCENT_RGB@, 0.8)
    inner_color = rgba(@BG_RGB@, 0.9)
    font_color = rgba(@FG_RGB@, 1.0)
    check_color = rgba(@YELLOW_RGB@, 1.0)
    fail_color = rgba(@RED_RGB@, 1.0)
    fade_on_empty = false
    placeholder_text = Contraseña
    fail_text = Contraseña incorrecta
    position = 0, -180
    halign = center
    valign = center
}
