[main]
font=JetBrainsMono Nerd Font:size=12
prompt="> "
terminal=kitty
layer=overlay
width=40
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=24
icons-enabled=yes

[colors]
background=@BG@f0
text=@FG2@ff
prompt=@ACCENT@ff
input=@FG@ff
match=@ACCENT@ff
selection=@BG3@ff
selection-text=@FG@ff
selection-match=@ACCENT2@ff
border=@ACCENT@aa

[border]
width=2
radius=12
