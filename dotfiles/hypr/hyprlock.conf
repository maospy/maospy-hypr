general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Wallpapers/maospy-nord.png
    blur_passes = 2
    blur_size = 6
}

label {
    monitor =
    text = $TIME
    color = rgba(236, 239, 244, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d de %B"
    color = rgba(216, 222, 233, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 10
    outer_color = rgba(136, 192, 208, 0.8)
    inner_color = rgba(46, 52, 64, 0.9)
    font_color = rgba(236, 239, 244, 1.0)
    check_color = rgba(235, 203, 139, 1.0)
    fail_color = rgba(191, 97, 106, 1.0)
    fade_on_empty = false
    placeholder_text = Contraseña
    fail_text = Contraseña incorrecta
    position = 0, -180
    halign = center
    valign = center
}
